# Parallel Workers Example
# Demonstrates spawning multiple workers that communicate via channels
#
# Run with: lexflow examples/async/parallel_workers.yaml

workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      results: []
      work_channel: null
      results_channel: null

    nodes:
      start:
        opcode: workflow_start
        next: print_start

      print_start:
        opcode: io_print
        next: create_channels
        args:
          - {literal: "Starting parallel workers...\n"}

      create_channels:
        opcode: data_set_variable_to
        next: create_results_channel
        kwargs:
          variable: {literal: "work_channel"}
          value: {node: make_work_ch}

      make_work_ch:
        opcode: channel_create
        kwargs:
          size: {literal: 20}

      create_results_channel:
        opcode: data_set_variable_to
        next: fork_all
        kwargs:
          variable: {literal: "results_channel"}
          value: {node: make_results_ch}

      make_results_ch:
        opcode: channel_create
        kwargs:
          size: {literal: 20}

      # Fork: producer, 3 workers, collector
      fork_all:
        opcode: control_fork
        next: print_results
        args:
          - {branch: producer}
          - {branch: worker1}
          - {branch: worker2}
          - {branch: collector}

      # Producer: send work items 1-5
      producer:
        opcode: control_for
        next: close_work
        kwargs:
          var: {literal: "work_item"}
          start: {literal: 1}
          end: {literal: 6}
          body: {branch: send_work}

      send_work:
        opcode: channel_send
        next: print_sent
        kwargs:
          channel: {variable: work_channel}
          value: {variable: work_item}

      print_sent:
        opcode: io_print
        next: null
        args:
          - {node: sent_msg}

      sent_msg:
        opcode: operator_add
        args:
          - {node: sent_prefix}
          - {literal: "\n"}

      sent_prefix:
        opcode: operator_add
        args:
          - {literal: "Producer sent: "}
          - {node: sent_str}

      sent_str:
        opcode: str
        kwargs:
          value: {variable: work_item}

      close_work:
        opcode: channel_close
        next: null
        kwargs:
          channel: {variable: work_channel}

      # Worker 1: process 2 items
      worker1:
        opcode: control_for
        next: null
        kwargs:
          var: {literal: "_w1"}
          start: {literal: 0}
          end: {literal: 2}
          body: {branch: worker1_process}

      worker1_process:
        opcode: data_set_variable_to
        next: worker1_compute
        kwargs:
          variable: {literal: "item"}
          value: {node: worker1_recv}

      worker1_recv:
        opcode: channel_receive
        kwargs:
          channel: {variable: work_channel}

      worker1_compute:
        opcode: channel_send
        next: null
        kwargs:
          channel: {variable: results_channel}
          value: {node: worker1_result}

      worker1_result:
        opcode: operator_multiply
        args:
          - {variable: item}
          - {literal: 2}

      # Worker 2: process 3 items
      worker2:
        opcode: control_for
        next: close_results
        kwargs:
          var: {literal: "_w2"}
          start: {literal: 0}
          end: {literal: 3}
          body: {branch: worker2_process}

      worker2_process:
        opcode: data_set_variable_to
        next: worker2_compute
        kwargs:
          variable: {literal: "item2"}
          value: {node: worker2_recv}

      worker2_recv:
        opcode: channel_receive
        kwargs:
          channel: {variable: work_channel}

      worker2_compute:
        opcode: channel_send
        next: null
        kwargs:
          channel: {variable: results_channel}
          value: {node: worker2_result}

      worker2_result:
        opcode: operator_multiply
        args:
          - {variable: item2}
          - {literal: 2}

      close_results:
        opcode: channel_close
        next: null
        kwargs:
          channel: {variable: results_channel}

      # Collector: gather all 5 results
      collector:
        opcode: control_for
        next: null
        kwargs:
          var: {literal: "_c"}
          start: {literal: 0}
          end: {literal: 5}
          body: {branch: collect_result}

      collect_result:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable: {literal: "results"}
          value: {node: append_result}

      append_result:
        opcode: list_append
        args:
          - {variable: results}
          - {node: collect_recv}

      collect_recv:
        opcode: channel_receive
        kwargs:
          channel: {variable: results_channel}

      print_results:
        opcode: io_print
        next: return_results
        args:
          - {node: results_msg}

      results_msg:
        opcode: operator_add
        args:
          - {node: results_prefix}
          - {literal: "\n"}

      results_prefix:
        opcode: operator_add
        args:
          - {literal: "Results: "}
          - {node: results_json}

      results_json:
        opcode: json_stringify
        kwargs:
          obj: {variable: results}

      return_results:
        opcode: workflow_return
        next: null
        args:
          - {variable: results}
