# Semaphore Rate Limiting Example
# Demonstrates using semaphores to limit concurrent operations
#
# Run with: lexflow examples/async/semaphore_rate_limit.yaml

workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      semaphore: null
      results: []

    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: create_semaphore
        args:
          - {literal: "Semaphore rate limiting example\nOnly 2 concurrent operations allowed\n\n"}

      create_semaphore:
        opcode: data_set_variable_to
        next: fork_workers
        kwargs:
          variable: {literal: "semaphore"}
          value: {node: make_sem}

      make_sem:
        opcode: sync_semaphore_create
        kwargs:
          permits: {literal: 2}

      # Fork 5 workers, but only 2 can run at a time
      fork_workers:
        opcode: control_fork
        next: print_done
        args:
          - {branch: worker_a}
          - {branch: worker_b}
          - {branch: worker_c}
          - {branch: worker_d}
          - {branch: worker_e}

      # Worker A
      worker_a:
        opcode: io_print
        next: acquire_a
        args:
          - {literal: "[A] Waiting for semaphore...\n"}

      acquire_a:
        opcode: sync_semaphore_acquire
        next: work_a
        kwargs:
          semaphore: {variable: semaphore}

      work_a:
        opcode: io_print
        next: sleep_a
        args:
          - {literal: "[A] Working...\n"}

      sleep_a:
        opcode: task_sleep
        next: done_a
        kwargs:
          seconds: {literal: 0.2}

      done_a:
        opcode: io_print
        next: release_a
        args:
          - {literal: "[A] Done!\n"}

      release_a:
        opcode: sync_semaphore_release
        next: null
        kwargs:
          semaphore: {variable: semaphore}

      # Worker B
      worker_b:
        opcode: io_print
        next: acquire_b
        args:
          - {literal: "[B] Waiting for semaphore...\n"}

      acquire_b:
        opcode: sync_semaphore_acquire
        next: work_b
        kwargs:
          semaphore: {variable: semaphore}

      work_b:
        opcode: io_print
        next: sleep_b
        args:
          - {literal: "[B] Working...\n"}

      sleep_b:
        opcode: task_sleep
        next: done_b
        kwargs:
          seconds: {literal: 0.2}

      done_b:
        opcode: io_print
        next: release_b
        args:
          - {literal: "[B] Done!\n"}

      release_b:
        opcode: sync_semaphore_release
        next: null
        kwargs:
          semaphore: {variable: semaphore}

      # Worker C
      worker_c:
        opcode: io_print
        next: acquire_c
        args:
          - {literal: "[C] Waiting for semaphore...\n"}

      acquire_c:
        opcode: sync_semaphore_acquire
        next: work_c
        kwargs:
          semaphore: {variable: semaphore}

      work_c:
        opcode: io_print
        next: sleep_c
        args:
          - {literal: "[C] Working...\n"}

      sleep_c:
        opcode: task_sleep
        next: done_c
        kwargs:
          seconds: {literal: 0.2}

      done_c:
        opcode: io_print
        next: release_c
        args:
          - {literal: "[C] Done!\n"}

      release_c:
        opcode: sync_semaphore_release
        next: null
        kwargs:
          semaphore: {variable: semaphore}

      # Worker D
      worker_d:
        opcode: io_print
        next: acquire_d
        args:
          - {literal: "[D] Waiting for semaphore...\n"}

      acquire_d:
        opcode: sync_semaphore_acquire
        next: work_d
        kwargs:
          semaphore: {variable: semaphore}

      work_d:
        opcode: io_print
        next: sleep_d
        args:
          - {literal: "[D] Working...\n"}

      sleep_d:
        opcode: task_sleep
        next: done_d
        kwargs:
          seconds: {literal: 0.2}

      done_d:
        opcode: io_print
        next: release_d
        args:
          - {literal: "[D] Done!\n"}

      release_d:
        opcode: sync_semaphore_release
        next: null
        kwargs:
          semaphore: {variable: semaphore}

      # Worker E
      worker_e:
        opcode: io_print
        next: acquire_e
        args:
          - {literal: "[E] Waiting for semaphore...\n"}

      acquire_e:
        opcode: sync_semaphore_acquire
        next: work_e
        kwargs:
          semaphore: {variable: semaphore}

      work_e:
        opcode: io_print
        next: sleep_e
        args:
          - {literal: "[E] Working...\n"}

      sleep_e:
        opcode: task_sleep
        next: done_e
        kwargs:
          seconds: {literal: 0.2}

      done_e:
        opcode: io_print
        next: release_e
        args:
          - {literal: "[E] Done!\n"}

      release_e:
        opcode: sync_semaphore_release
        next: null
        kwargs:
          semaphore: {variable: semaphore}

      print_done:
        opcode: io_print
        next: null
        args:
          - {literal: "\nAll workers completed!\n"}
