# Background Counter Example
# Demonstrates spawning a background task that updates a shared variable
#
# Run with: lexflow examples/async/background_counter.yaml

workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      counter: 0
      running: true

    nodes:
      start:
        opcode: workflow_start
        next: print_start

      print_start:
        opcode: io_print
        next: spawn_counter
        args:
          - {literal: "Starting background counter...\n"}

      spawn_counter:
        opcode: control_spawn
        next: main_loop
        kwargs:
          var: {literal: "counter_task"}
          body: {branch: counter_loop}

      # Background task: increment counter every 100ms
      counter_loop:
        opcode: control_while
        next: null
        kwargs:
          condition: {variable: running}
          body: {branch: increment_counter}

      increment_counter:
        opcode: data_set_variable_to
        next: counter_sleep
        kwargs:
          variable: {literal: "counter"}
          value: {node: add_one}

      add_one:
        opcode: operator_add
        args:
          - {variable: counter}
          - {literal: 1}

      counter_sleep:
        opcode: task_sleep
        next: null
        kwargs:
          seconds: {literal: 0.1}

      # Main loop: print counter 5 times, then stop
      main_loop:
        opcode: control_for
        next: stop_counter
        kwargs:
          var: {literal: "i"}
          start: {literal: 0}
          end: {literal: 5}
          body: {branch: print_and_wait}

      print_and_wait:
        opcode: io_print
        next: main_sleep
        args:
          - {node: format_counter}

      format_counter:
        opcode: operator_add
        args:
          - {node: add_prefix}
          - {literal: "\n"}

      add_prefix:
        opcode: operator_add
        args:
          - {literal: "Counter: "}
          - {node: counter_str}

      counter_str:
        opcode: str
        kwargs:
          value: {variable: counter}

      main_sleep:
        opcode: task_sleep
        next: null
        kwargs:
          seconds: {literal: 0.25}

      stop_counter:
        opcode: data_set_variable_to
        next: wait_for_task
        kwargs:
          variable: {literal: "running"}
          value: {literal: false}

      wait_for_task:
        opcode: task_await
        next: print_final
        kwargs:
          task: {variable: counter_task}
          timeout: {literal: 1.0}

      print_final:
        opcode: io_print
        next: return_count
        args:
          - {node: final_msg}

      final_msg:
        opcode: operator_add
        args:
          - {node: final_prefix}
          - {literal: "\n"}

      final_prefix:
        opcode: operator_add
        args:
          - {literal: "Final counter value: "}
          - {node: final_str}

      final_str:
        opcode: str
        kwargs:
          value: {variable: counter}

      return_count:
        opcode: workflow_return
        next: null
        args:
          - {variable: counter}
