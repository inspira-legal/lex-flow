# Timeout Example
# Demonstrates using timeouts to limit operation duration
#
# Run with: lexflow examples/async/timeout_example.yaml

workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      result: "not set"

    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: fast_operation
        args:
          - {literal: "Testing timeout functionality...\n\n"}

      # Test 1: Fast operation completes within timeout
      fast_operation:
        opcode: io_print
        next: fast_timeout
        args:
          - {literal: "Test 1: Fast operation (timeout: 5s)\n"}

      fast_timeout:
        opcode: async_timeout
        next: print_fast_result
        kwargs:
          timeout: {literal: 5.0}
          body: {branch: fast_work}

      fast_work:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable: {literal: "result"}
          value: {literal: "completed quickly"}

      print_fast_result:
        opcode: io_print
        next: slow_operation
        args:
          - {node: fast_result_msg}

      fast_result_msg:
        opcode: operator_add
        args:
          - {node: fast_prefix}
          - {literal: "\n\n"}

      fast_prefix:
        opcode: operator_add
        args:
          - {literal: "Result: "}
          - {variable: result}

      # Test 2: Slow operation times out with fallback
      slow_operation:
        opcode: io_print
        next: slow_timeout
        args:
          - {literal: "Test 2: Slow operation with fallback (timeout: 0.1s)\n"}

      slow_timeout:
        opcode: async_timeout
        next: print_slow_result
        kwargs:
          timeout: {literal: 0.1}
          body: {branch: slow_work}
          on_timeout: {branch: timeout_fallback}

      slow_work:
        opcode: task_sleep
        next: set_slow_result
        kwargs:
          seconds: {literal: 10.0}

      set_slow_result:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable: {literal: "result"}
          value: {literal: "completed slowly"}

      timeout_fallback:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable: {literal: "result"}
          value: {literal: "timed out (fallback executed)"}

      print_slow_result:
        opcode: io_print
        next: return_result
        args:
          - {node: slow_result_msg}

      slow_result_msg:
        opcode: operator_add
        args:
          - {node: slow_prefix}
          - {literal: "\n"}

      slow_prefix:
        opcode: operator_add
        args:
          - {literal: "Result: "}
          - {variable: result}

      return_result:
        opcode: workflow_return
        next: null
        args:
          - {variable: result}
