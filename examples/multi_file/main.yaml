workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables: {}
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: call_greet
        args:
          - literal: "Testing multi-file imports:\n"

      call_greet:
        opcode: workflow_call
        next: print_newline
        args:
          - literal: "Alice"

        kwargs:
          workflow:
            literal: greet
      print_newline:
        opcode: io_print
        next: call_helper_main
        args:
          - literal: "\n"

      call_helper_main:
        opcode: workflow_call
        next: print_done
        kwargs:
          workflow:
            literal: main

      print_done:
        opcode: io_print
        next: null
        args:
          - literal: "Done!\n"
