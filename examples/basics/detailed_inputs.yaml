# Demonstrates the detailed interface inputs format with name, type, and required fields.
# This format is used by the web editor to display type hints and required indicators.
#
# Run: lexflow examples/basics/detailed_inputs.yaml --input username=Alice --input age=30 --input verbose=true

workflows:
  - name: main
    interface:
      inputs:
        - name: "username"
          type: "string"
          required: true
        - name: "age"
          type: "number"
          required: false
        - name: "verbose"
          type: "boolean"
          required: false
        - name: "hobbies"
          type: "list"
          required: false
      outputs: []
    variables:
      username: "World"
      age: 0
      verbose: false
      hobbies: ["reading", "coding"]
      greeting: ""
      birth_year: 0
    nodes:
      start:
        opcode: workflow_start
        next: build_greeting

      # Build greeting string: "Hello, <username>!"
      build_greeting:
        opcode: data_set_variable_to
        next: print_greeting
        kwargs:
          variable:
            literal: "greeting"
          value:
            node: greeting_full

      greeting_prefix:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "Hello, "
          right:
            variable: username

      greeting_full:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: greeting_prefix
          right:
            literal: "!\n"

      print_greeting:
        opcode: io_print
        next: check_age
        args:
          - variable: greeting

      # If age > 0, calculate and print approximate birth year
      check_age:
        opcode: control_if
        next: check_verbose
        kwargs:
          condition:
            node: age_provided
          then:
            branch: calc_birth_year

      age_provided:
        opcode: operator_greater_than
        isReporter: true
        args:
          - variable: age
          - literal: 0

      calc_birth_year:
        opcode: data_set_variable_to
        next: print_birth_year
        kwargs:
          variable:
            literal: "birth_year"
          value:
            node: birth_year_calc

      birth_year_calc:
        opcode: operator_subtract
        isReporter: true
        kwargs:
          left:
            literal: 2026
          right:
            variable: age

      print_birth_year:
        opcode: io_print
        next: null
        args:
          - node: birth_year_msg

      birth_year_msg:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: birth_year_msg_prefix
          right:
            literal: ".\n"

      birth_year_msg_prefix:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "You were born around "
          right:
            node: birth_year_str

      birth_year_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: birth_year

      # If verbose is true, print the hobbies list
      check_verbose:
        opcode: control_if
        next: null
        kwargs:
          condition:
            variable: verbose
          then:
            branch: print_hobbies_header

      print_hobbies_header:
        opcode: io_print
        next: print_hobby_count
        args:
          - literal: "Your hobbies:\n"

      print_hobby_count:
        opcode: io_print
        next: iterate_hobbies
        args:
          - node: hobby_count_msg

      hobby_count_msg:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  ("
          right:
            node: hobby_count_suffix

      hobby_count_suffix:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: hobby_count_str
          right:
            literal: " total)\n"

      hobby_count_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: hobby_count

      hobby_count:
        opcode: list_length
        isReporter: true
        kwargs:
          items:
            variable: hobbies

      iterate_hobbies:
        opcode: control_foreach
        next: null
        kwargs:
          var:
            literal: "hobby"
          iterable:
            variable: hobbies
          body:
            branch: print_hobby

      print_hobby:
        opcode: io_print
        next: null
        args:
          - node: hobby_line

      hobby_line:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  - "
          right:
            node: hobby_with_newline

      hobby_with_newline:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: hobby
          right:
            literal: "\n"
