workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      fruits: ["apple", "banana", "cherry"]
      numbers: [10, 20, 30, 40]
      person:
        name: "Alice"
        age: 30
        city: "NYC"
    nodes:
      start:
        opcode: workflow_start
        next: print_header

      print_header:
        opcode: io_print
        next: test_list
        args:
          - literal: "=== Testing control_foreach ===\n\n"

      # Test 1: Iterate over list of strings
      test_list:
        opcode: io_print
        next: foreach_fruits
        args:
          - literal: "Test 1: Iterate over fruits list:\n"

      foreach_fruits:
        opcode: control_foreach
        next: test_numbers
        kwargs:
          var:
            literal: "fruit"
          iterable:
            variable: fruits
          body:
            branch: print_fruit

      print_fruit:
        opcode: io_print
        next: null
        args:
          - node: format_fruit

      format_fruit:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "  - "
          - node: add_newline

      add_newline:
        opcode: operator_add
        isReporter: true
        args:
          - variable: fruit
          - literal: "\n"

      # Test 2: Iterate over list of numbers
      test_numbers:
        opcode: io_print
        next: foreach_numbers
        args:
          - literal: "\nTest 2: Iterate over numbers and double them:\n"

      foreach_numbers:
        opcode: control_foreach
        next: test_dict_keys
        kwargs:
          var:
            literal: "num"
          iterable:
            variable: numbers
          body:
            branch: print_doubled

      print_doubled:
        opcode: io_print
        next: null
        args:
          - node: format_doubled

      format_doubled:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "  "
          - node: double_and_format

      double_and_format:
        opcode: operator_add
        isReporter: true
        args:
          - node: doubled_as_str
          - literal: "\n"

      doubled_as_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: doubled

      doubled:
        opcode: operator_multiply
        isReporter: true
        args:
          - variable: num
          - literal: 2

      # Test 3: Iterate over dict keys
      test_dict_keys:
        opcode: io_print
        next: foreach_keys
        args:
          - literal: "\nTest 3: Iterate over dict keys:\n"

      foreach_keys:
        opcode: control_foreach
        next: print_footer
        kwargs:
          var:
            literal: "key"
          iterable:
            variable: person
          body:
            branch: print_key

      print_key:
        opcode: io_print
        next: null
        args:
          - node: format_key

      format_key:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "  Key: "
          - node: key_with_newline

      key_with_newline:
        opcode: operator_add
        isReporter: true
        args:
          - variable: key
          - literal: "\n"

      print_footer:
        opcode: io_print
        next: null
        args:
          - literal: "\n✅ All control_foreach tests passed!\n"
