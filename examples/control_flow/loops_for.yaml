workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables: {}
    nodes:
      start:
        opcode: workflow_start
        next: print_header

      print_header:
        opcode: io_print
        next: test_basic_for
        args:
          - literal: "=== Testing control_for ===\n\n"

      # Test 1: Basic for loop 0 to 5
      test_basic_for:
        opcode: io_print
        next: for_loop_1
        args:
          - literal: "Test 1: Basic for loop (0 to 5):\n"

      for_loop_1:
        opcode: control_for
        next: test_with_step
        kwargs:
          var:
            literal: "i"
          start:
            literal: 0
          end:
            literal: 5
          body:
            branch: print_i

      print_i:
        opcode: io_print
        next: null
        args:
          - variable: i

      # Test 2: For loop with step
      test_with_step:
        opcode: io_print
        next: for_loop_2
        args:
          - literal: "\n\nTest 2: For loop with step=2 (0 to 10):\n"

      for_loop_2:
        opcode: control_for
        next: test_with_start
        kwargs:
          var:
            literal: "j"
          start:
            literal: 0
          end:
            literal: 10
          step:
            literal: 2
          body:
            branch: print_j

      print_j:
        opcode: io_print
        next: null
        args:
          - variable: j

      # Test 3: For loop with start != 0
      test_with_start:
        opcode: io_print
        next: for_loop_3
        args:
          - literal: "\n\nTest 3: For loop (5 to 8):\n"

      for_loop_3:
        opcode: control_for
        next: print_footer
        kwargs:
          var:
            literal: "k"
          start:
            literal: 5
          end:
            literal: 8
          body:
            branch: print_k

      print_k:
        opcode: io_print
        next: null
        args:
          - variable: k

      print_footer:
        opcode: io_print
        next: null
        args:
          - literal: "\n\n✅ All control_for tests passed!\n"
