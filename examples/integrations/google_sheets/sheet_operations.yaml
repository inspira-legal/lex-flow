# Various Google Sheets operations
#
# This example demonstrates multiple sheets operations:
# - Test connection
# - List all sheets in a spreadsheet
# - Get last row number
# - Read specific row and column
#
# Usage:
#   lexflow examples/integrations/google_sheets/sheet_operations.yaml \
#     --input spreadsheet_id=YOUR_SPREADSHEET_ID \
#     --input sheet_name=Sheet1
#
# Authentication:
#   Set GOOGLE_APPLICATION_CREDENTIALS environment variable to your service account JSON file
#   Or use: gcloud auth application-default login

workflows:
  - name: main
    interface:
      inputs: [spreadsheet_id, sheet_name]
      outputs: []
    variables:
      spreadsheet_id: ""
      sheet_name: "Sheet1"
      client: null
      sheets_list: []
      last_row: 0
      first_row: []
      column_a: []
    nodes:
      start:
        opcode: workflow_start
        next: store_client

      # Create client
      create_client:
        opcode: sheets_create_client
        isReporter: true

      store_client:
        opcode: data_set_variable_to
        next: do_test_connection
        kwargs:
          variable: {literal: "client"}
          value: {node: create_client}

      # Test connection first
      test_connection:
        opcode: sheets_test_connection
        isReporter: true
        kwargs:
          client: {variable: client}
          spreadsheet_id: {variable: spreadsheet_id}

      do_test_connection:
        opcode: data_set_variable_to
        next: print_connected
        kwargs:
          variable: {literal: "_"}
          value: {node: test_connection}

      print_connected:
        opcode: io_print
        next: store_sheets_list
        args:
          - {literal: "Connected to spreadsheet!"}

      # List all sheets
      list_sheets:
        opcode: sheets_list_sheets
        isReporter: true
        kwargs:
          client: {variable: client}
          spreadsheet_id: {variable: spreadsheet_id}

      store_sheets_list:
        opcode: data_set_variable_to
        next: print_sheets_header
        kwargs:
          variable: {literal: "sheets_list"}
          value: {node: list_sheets}

      print_sheets_header:
        opcode: io_print
        next: print_sheets
        args:
          - {literal: "\n=== Sheets in spreadsheet ==="}

      print_sheets:
        opcode: io_print
        next: store_last_row
        args:
          - {variable: sheets_list}

      # Get last row
      get_last_row:
        opcode: sheets_get_last_row
        isReporter: true
        kwargs:
          client: {variable: client}
          spreadsheet_id: {variable: spreadsheet_id}
          sheet_name: {variable: sheet_name}

      store_last_row:
        opcode: data_set_variable_to
        next: print_last_row_header
        kwargs:
          variable: {literal: "last_row"}
          value: {node: get_last_row}

      print_last_row_header:
        opcode: io_print
        next: print_last_row
        args:
          - {literal: "\n=== Last row number ==="}

      print_last_row:
        opcode: io_print
        next: store_first_row
        args:
          - {variable: last_row}

      # Read first row (headers)
      get_first_row:
        opcode: sheets_get_row
        isReporter: true
        kwargs:
          client: {variable: client}
          spreadsheet_id: {variable: spreadsheet_id}
          sheet_name: {variable: sheet_name}
          row_number: {literal: 1}

      store_first_row:
        opcode: data_set_variable_to
        next: print_first_row_header
        kwargs:
          variable: {literal: "first_row"}
          value: {node: get_first_row}

      print_first_row_header:
        opcode: io_print
        next: print_first_row
        args:
          - {literal: "\n=== First row (headers) ==="}

      print_first_row:
        opcode: io_print
        next: store_column_a
        args:
          - {variable: first_row}

      # Read column A
      get_column_a:
        opcode: sheets_get_column
        isReporter: true
        kwargs:
          client: {variable: client}
          spreadsheet_id: {variable: spreadsheet_id}
          sheet_name: {variable: sheet_name}
          column: {literal: "A"}

      store_column_a:
        opcode: data_set_variable_to
        next: print_column_header
        kwargs:
          variable: {literal: "column_a"}
          value: {node: get_column_a}

      print_column_header:
        opcode: io_print
        next: print_column
        args:
          - {literal: "\n=== Column A values ==="}

      print_column:
        opcode: io_print
        next: null
        args:
          - {variable: column_a}
