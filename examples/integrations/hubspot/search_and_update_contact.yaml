# HubSpot: Search and Update Contact
# Busca um contato por email e atualiza o lead score
#
# Uso:
#   lexflow search_and_update_contact.yaml \
#     --input token=$HUBSPOT_TOKEN \
#     --input email=test@example.com \
#     --input score=85
#
# Requer:
#   pip install lexflow[hubspot]

workflows:
  - name: main
    interface:
      inputs: [token, email, score]
      outputs: []
    variables:
      token: ""
      email: ""
      score: 0
      client: null
      results: []
      contact_id: ""
    nodes:
      start:
        opcode: workflow_start
        next: print_start

      print_start:
        opcode: io_print
        next: store_client
        kwargs:
          values:
            - {literal: "Searching for contact: "}
            - {variable: email}

      # Criar cliente HubSpot
      create_client:
        opcode: hubspot_create_client
        isReporter: true
        kwargs:
          access_token: {variable: token}

      store_client:
        opcode: data_set_variable_to
        next: store_results
        kwargs:
          variable: {literal: "client"}
          value: {node: create_client}

      # Buscar contato por email
      search_contact:
        opcode: hubspot_search_contacts
        isReporter: true
        kwargs:
          client: {variable: client}
          filters:
            - propertyName: "email"
              operator: "EQ"
              value: {variable: email}
          properties: ["email", "firstname", "lastname", "company"]

      # Extrair resultados
      get_results:
        opcode: dict_get
        isReporter: true
        args:
          - {node: search_contact}
          - {literal: "results"}

      store_results:
        opcode: data_set_variable_to
        next: check_found
        kwargs:
          variable: {literal: "results"}
          value: {node: get_results}

      # Verificar se encontrou
      results_length:
        opcode: list_length
        isReporter: true
        args:
          - {variable: results}

      has_results:
        opcode: operator_greater_than
        isReporter: true
        kwargs:
          left: {node: results_length}
          right: {literal: 0}

      check_found:
        opcode: control_if
        kwargs:
          condition: {node: has_results}
        branches:
          THEN: {branch: get_first_contact}
          ELSE: {branch: not_found}

      # Se encontrou, extrair ID e atualizar
      first_contact:
        opcode: list_get
        isReporter: true
        args:
          - {variable: results}
          - {literal: 0}

      extract_contact_id:
        opcode: dict_get
        isReporter: true
        args:
          - {node: first_contact}
          - {literal: "id"}

      get_first_contact:
        opcode: data_set_variable_to
        next: do_update
        kwargs:
          variable: {literal: "contact_id"}
          value: {node: extract_contact_id}

      do_update:
        opcode: hubspot_update_contact
        next: print_success
        kwargs:
          client: {variable: client}
          contact_id: {variable: contact_id}
          properties:
            lead_score: {variable: score}

      print_success:
        opcode: io_print
        next: null
        kwargs:
          values:
            - {literal: "Contact "}
            - {variable: contact_id}
            - {literal: " updated with score: "}
            - {variable: score}

      # Se nao encontrou
      not_found:
        opcode: io_print
        next: null
        kwargs:
          values:
            - {literal: "Contact not found with email: "}
            - {variable: email}
