# GCS (Google Cloud Storage) Example
#
# This workflow demonstrates how to:
# 1. Create a GCS client (native async)
# 2. Check if an object exists
# 3. Get object metadata
# 4. Download object content as bytes
# 5. Close the client
#
# Prerequisites:
# - pip install lexflow[gcs]
# - gcloud auth application-default login
#
# Usage:
# lexflow gcs_example.yaml

workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      client: null
      object_bytes: null
      metadata: null
      exists: false
      # Configure these values for your GCS setup
      bucket_name: "your-bucket-name"
      object_name: "path/to/your/file.pdf"
    nodes:
      start:
        opcode: workflow_start
        next: intro

      intro:
        opcode: io_print
        next: store_client
        args:
          - literal: "=== GCS Download Example ===\n\n"

      # Step 1: Create GCS client (native async with gcloud-aio-storage)
      create_client:
        opcode: gcs_create_client
        isReporter: true

      store_client:
        opcode: data_set_variable_to
        next: print_client_created
        kwargs:
          variable:
            literal: "client"
          value:
            node: create_client

      print_client_created:
        opcode: io_print
        next: store_exists
        args:
          - literal: "1. GCS async client created\n"

      # Step 2: Check if object exists
      check_exists:
        opcode: gcs_object_exists
        isReporter: true
        kwargs:
          client:
            variable: "client"
          bucket_name:
            variable: "bucket_name"
          object_name:
            variable: "object_name"

      store_exists:
        opcode: data_set_variable_to
        next: print_exists
        kwargs:
          variable:
            literal: "exists"
          value:
            node: check_exists

      print_exists:
        opcode: io_print
        next: store_metadata
        args:
          - node: exists_message

      exists_message:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "2. Object exists: "
          right:
            node: exists_str

      exists_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: "exists"

      # Step 3: Get object metadata
      get_metadata:
        opcode: gcs_get_object_metadata
        isReporter: true
        kwargs:
          client:
            variable: "client"
          bucket_name:
            variable: "bucket_name"
          object_name:
            variable: "object_name"

      store_metadata:
        opcode: data_set_variable_to
        next: print_metadata
        kwargs:
          variable:
            literal: "metadata"
          value:
            node: get_metadata

      print_metadata:
        opcode: io_print
        next: store_bytes
        args:
          - literal: "\n3. Object metadata retrieved\n"

      # Step 4: Download object as bytes
      download_bytes:
        opcode: gcs_download_object_as_bytes
        isReporter: true
        kwargs:
          client:
            variable: "client"
          bucket_name:
            variable: "bucket_name"
          object_name:
            variable: "object_name"

      store_bytes:
        opcode: data_set_variable_to
        next: print_downloaded
        kwargs:
          variable:
            literal: "object_bytes"
          value:
            node: download_bytes

      print_downloaded:
        opcode: io_print
        next: close_client
        args:
          - literal: "4. Object downloaded as bytes\n"

      # Step 5: Close client (releases async resources)
      close_client:
        opcode: gcs_close_client
        next: final_message
        kwargs:
          client:
            variable: "client"

      final_message:
        opcode: io_print
        next: null
        args:
          - literal: "\n5. Client closed\n\n=== GCS operations completed! ===\n"
