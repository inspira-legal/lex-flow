# Simple AI Chat with History
#
# This example demonstrates a multi-turn AI conversation using:
# - Chat history management opcodes (chat_create, chat_with_agent)
# - Pydantic AI integration with Vertex AI
#
# Run: lexflow examples/integrations/ai_chat/simple_chat.yaml --input project=YOUR_GCP_PROJECT
#
# Requirements:
#   pip install lexflow[ai]
#   gcloud auth application-default login

workflows:
  - name: main
    interface:
      inputs: [project]
      outputs: []
    variables:
      project: ""
      model: null
      agent: null
      history: null
      user_input: ""
      response: ""
      running: true
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      # Introduction
      print_intro:
        opcode: io_print
        next: store_model
        args:
          - literal: "=== AI Chat with History ===\n\nType your message and press Enter.\nType 'quit' to exit.\n\n"

      # Step 1: Create Vertex AI Model
      create_model:
        opcode: pydantic_ai_create_vertex_model
        isReporter: true
        kwargs:
          model_name:
            literal: "gemini-2.5-flash"
          project:
            variable: project
          location:
            literal: "us-central1"

      store_model:
        opcode: data_set_variable_to
        next: store_agent
        kwargs:
          variable:
            literal: "model"
          value:
            node: create_model

      # Step 2: Create AI Agent
      create_agent:
        opcode: pydantic_ai_create_agent
        isReporter: true
        kwargs:
          model:
            variable: "model"
          instructions:
            literal: "You are a helpful AI assistant having a conversation. Be concise but friendly. Remember context from previous messages in the conversation."

      store_agent:
        opcode: data_set_variable_to
        next: store_history
        kwargs:
          variable:
            literal: "agent"
          value:
            node: create_agent

      # Step 3: Create empty chat history
      create_history:
        opcode: chat_create
        isReporter: true

      store_history:
        opcode: data_set_variable_to
        next: print_ready
        kwargs:
          variable:
            literal: "history"
          value:
            node: create_history

      print_ready:
        opcode: io_print
        next: chat_loop
        args:
          - literal: "Chat initialized. Start chatting!\n\n"

      # Main chat loop
      chat_loop:
        opcode: control_while
        next: print_goodbye
        kwargs:
          condition:
            variable: running
          body:
            branch: store_input

      # Get user input (reporter only - evaluated when referenced)
      get_input:
        opcode: io_input
        isReporter: true
        kwargs:
          prompt:
            literal: "You: "

      # Store input and continue flow
      store_input:
        opcode: data_set_variable_to
        next: check_quit
        kwargs:
          variable:
            literal: "user_input"
          value:
            node: get_input

      # Check if user wants to quit
      check_quit:
        opcode: control_if_else
        next: null
        kwargs:
          condition:
            node: is_quit
          then:
            branch: set_quit
          else:
            branch: process_message

      is_quit:
        opcode: operator_equals
        isReporter: true
        kwargs:
          left:
            variable: user_input
          right:
            literal: "quit"

      # Set running to false to exit loop
      set_quit:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "running"
          value:
            literal: false

      # Process user message with AI
      process_message:
        opcode: chat_with_agent
        next: store_response
        isReporter: true
        kwargs:
          agent:
            variable: agent
          history:
            variable: history
          user_message:
            variable: user_input

      store_response:
        opcode: data_set_variable_to
        next: print_response
        kwargs:
          variable:
            literal: "response"
          value:
            node: process_message

      print_response:
        opcode: io_print
        next: print_newline
        args:
          - node: format_response

      format_response:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "AI: "
          right:
            variable: response

      print_newline:
        opcode: io_print
        next: null
        args:
          - literal: "\n\n"

      # Goodbye message
      print_goodbye:
        opcode: io_print
        next: show_history
        args:
          - literal: "\n--- Chat ended ---\n\n"

      # Show final chat history
      show_history:
        opcode: io_print
        next: print_formatted_history
        args:
          - literal: "Full conversation:\n\n"

      format_history:
        opcode: chat_format_for_display
        isReporter: true
        kwargs:
          history:
            variable: history

      print_formatted_history:
        opcode: io_print
        next: final_message
        args:
          - node: format_history

      final_message:
        opcode: io_print
        next: null
        args:
          - literal: "\n\n=== Chat session complete ===\n"
