workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      model: null
      agent: null
    nodes:
      start:
        opcode: workflow_start
        next: intro

      intro:
        opcode: io_print
        next: store_model
        args:
          - literal: "=== Pydantic AI + Vertex AI Example ===\n\n"

      # Step 1: Create Vertex AI Model (reporter node)
      create_model:
        opcode: pydantic_ai_create_vertex_model
        isReporter: true
        kwargs:
          model_name:
            literal: "gemini-2.5-flash"
          project:
            literal: "your-project-id"
          location:
            literal: "us-central1"

      # Store model in variable
      store_model:
        opcode: data_set_variable_to
        next: print_model_created
        kwargs:
          variable:
            literal: "model"
          value:
            node: create_model

      print_model_created:
        opcode: io_print
        next: store_agent
        args:
          - literal: "1. Created Vertex AI model: gemini-2.5-flash\n\n"

      # Step 2: Create Agent (reporter node)
      create_agent:
        opcode: pydantic_ai_create_agent
        isReporter: true
        kwargs:
          model:
            variable: "model"
          instructions:
            literal: "You are a helpful AI assistant. Be concise and accurate."

      # Store agent in variable
      store_agent:
        opcode: data_set_variable_to
        next: print_agent_created
        kwargs:
          variable:
            literal: "agent"
          value:
            node: create_agent

      print_agent_created:
        opcode: io_print
        next: query_math
        args:
          - literal: "2. Created AI agent with instructions\n\n"

      # Step 3: Math Query
      query_math:
        opcode: io_print
        next: print_math_result
        args:
          - literal: "3. Asking: What is 15 * 23?\n"

      run_math_query:
        opcode: pydantic_ai_run_sync
        isReporter: true
        kwargs:
          agent:
            variable: "agent"
          prompt:
            literal: "What is 15 * 23? Just give the number."

      print_math_result:
        opcode: io_print
        next: query_capital
        args:
          - node: math_result_str

      math_result_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "   Answer: "
          right:
            node: run_math_query

      # Step 4: Geography Query
      query_capital:
        opcode: io_print
        next: print_capital_result
        args:
          - literal: "\n4. Asking: What is the capital of France?\n"

      run_capital_query:
        opcode: pydantic_ai_run_sync
        isReporter: true
        kwargs:
          agent:
            variable: "agent"
          prompt:
            literal: "What is the capital of France? One word only."

      print_capital_result:
        opcode: io_print
        next: query_code
        args:
          - node: capital_result_str

      capital_result_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "   Answer: "
          right:
            node: run_capital_query

      # Step 5: Programming Query
      query_code:
        opcode: io_print
        next: print_code_result
        args:
          - literal: "\n5. Asking: Explain recursion in one sentence\n"

      run_code_query:
        opcode: pydantic_ai_run_sync
        isReporter: true
        kwargs:
          agent:
            variable: "agent"
          prompt:
            literal: "Explain recursion in one sentence."

      print_code_result:
        opcode: io_print
        next: final_message
        args:
          - node: code_result_str

      code_result_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "   Answer: "
          right:
            node: run_code_query

      final_message:
        opcode: io_print
        next: null
        args:
          - literal: "\n=== All queries completed! ===\n"
