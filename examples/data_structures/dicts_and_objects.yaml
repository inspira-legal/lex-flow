workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      user_dict: {}
      person_obj: null
    nodes:
      start:
        opcode: workflow_start
        next: intro

      intro:
        opcode: io_print
        next: test_dict_from_lists
        args:
          - literal: "=== Dictionary and Object Operations ===\n\n"

      # Test 1: Create dictionary from lists
      test_dict_from_lists:
        opcode: io_print
        next: create_dict_from_lists
        args:
          - literal: "1. Creating dictionary from lists:\n"

      create_dict_from_lists:
        opcode: dict_from_lists
        next: print_dict1
        isReporter: true
        kwargs:
          keys:
            literal: ["name", "age", "role"]
          values:
            literal: ["Alice", 30, "engineer"]

      print_dict1:
        opcode: io_print
        next: test_dict_set
        args:
          - node: dict1_str

      dict1_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Created: "
          right:
            node: dict1_repr

      dict1_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: create_dict_from_lists

      # Test 2: Add property to dictionary
      test_dict_set:
        opcode: io_print
        next: add_email
        args:
          - literal: "\n2. Adding properties:\n"

      add_email:
        opcode: dict_set
        next: print_with_email
        isReporter: true
        kwargs:
          d:
            node: create_dict_from_lists
          key:
            literal: "email"
          value:
            literal: "alice@example.com"

      print_with_email:
        opcode: io_print
        next: test_dict_get
        args:
          - node: with_email_str

      with_email_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  After adding email: "
          right:
            node: with_email_repr

      with_email_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: add_email

      # Test 3: Get values from dictionary
      test_dict_get:
        opcode: io_print
        next: get_name
        args:
          - literal: "\n3. Getting values:\n"

      get_name:
        opcode: dict_get
        next: print_name
        isReporter: true
        kwargs:
          d:
            node: add_email
          key:
            literal: "name"

      print_name:
        opcode: io_print
        next: get_missing
        args:
          - node: name_str

      name_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Name: "
          right:
            node: get_name

      get_missing:
        opcode: dict_get
        next: print_missing
        isReporter: true
        kwargs:
          d:
            node: add_email
          key:
            literal: "phone"
          default:
            literal: "N/A"

      print_missing:
        opcode: io_print
        next: test_dict_keys
        args:
          - node: missing_str

      missing_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Phone (with default): "
          right:
            node: get_missing

      # Test 4: List dictionary keys
      test_dict_keys:
        opcode: io_print
        next: get_keys
        args:
          - literal: "\n4. Listing keys:\n"

      get_keys:
        opcode: dict_keys
        next: print_keys
        isReporter: true
        kwargs:
          d:
            node: add_email

      print_keys:
        opcode: io_print
        next: test_object_create
        args:
          - node: keys_str

      keys_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Keys: "
          right:
            node: keys_repr

      keys_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: get_keys

      # Test 5: Create object from dictionary
      test_object_create:
        opcode: io_print
        next: dict_to_object
        args:
          - literal: "\n5. Converting to object:\n"

      dict_to_object:
        opcode: object_from_dict
        next: print_object
        isReporter: true
        kwargs:
          d:
            node: add_email

      print_object:
        opcode: io_print
        next: test_object_get
        args:
          - node: obj_str

      obj_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  As object: "
          right:
            node: obj_repr

      obj_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: dict_to_object

      # Test 6: Get property from object
      test_object_get:
        opcode: io_print
        next: get_obj_name
        args:
          - literal: "\n6. Getting object property:\n"

      get_obj_name:
        opcode: object_get
        next: print_obj_name
        isReporter: true
        kwargs:
          obj:
            node: dict_to_object
          key:
            literal: "role"

      print_obj_name:
        opcode: io_print
        next: test_object_set
        args:
          - node: obj_name_str

      obj_name_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Role: "
          right:
            node: get_obj_name

      # Test 7: Set property on object
      test_object_set:
        opcode: io_print
        next: set_verified
        args:
          - literal: "\n7. Setting object property:\n"

      set_verified:
        opcode: object_set
        next: print_updated_obj
        isReporter: true
        kwargs:
          obj:
            node: dict_to_object
          key:
            literal: "verified"
          value:
            literal: true

      print_updated_obj:
        opcode: io_print
        next: test_object_has
        args:
          - node: updated_obj_str

      updated_obj_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  After adding verified: "
          right:
            node: updated_obj_repr

      updated_obj_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: set_verified

      # Test 8: Check if property exists
      test_object_has:
        opcode: io_print
        next: check_has_email
        args:
          - literal: "\n8. Checking properties:\n"

      check_has_email:
        opcode: object_has
        next: print_has_email
        isReporter: true
        kwargs:
          obj:
            node: set_verified
          key:
            literal: "email"

      print_has_email:
        opcode: io_print
        next: check_has_phone
        args:
          - node: has_email_str

      has_email_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Has email: "
          right:
            node: has_email_repr

      has_email_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: check_has_email

      check_has_phone:
        opcode: object_has
        next: print_has_phone
        isReporter: true
        kwargs:
          obj:
            node: set_verified
          key:
            literal: "phone"

      print_has_phone:
        opcode: io_print
        next: test_object_to_dict
        args:
          - node: has_phone_str

      has_phone_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Has phone: "
          right:
            node: has_phone_repr

      has_phone_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: check_has_phone

      # Test 9: Convert back to dictionary
      test_object_to_dict:
        opcode: io_print
        next: obj_to_dict
        args:
          - literal: "\n9. Converting back to dictionary:\n"

      obj_to_dict:
        opcode: object_to_dict
        next: print_back_to_dict
        isReporter: true
        kwargs:
          obj:
            node: set_verified

      print_back_to_dict:
        opcode: io_print
        next: final_message
        args:
          - node: back_to_dict_str

      back_to_dict_str:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Back to dict: "
          right:
            node: back_to_dict_repr

      back_to_dict_repr:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: obj_to_dict

      final_message:
        opcode: io_print
        next: null
        args:
          - literal: "\n=== All tests completed! ===\n"
