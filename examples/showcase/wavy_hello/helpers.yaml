# Helper workflows for wavy hello HTML generator
#
# build_wavy_spans: Converts a string into individual <span> elements
# with staggered animation-delay for a wave effect.

workflows:
  - name: build_wavy_spans
    interface:
      inputs: ["text"]
      outputs: ["spans_html"]
    variables:
      text: ""
      spans_html: ""
      i: 0
      text_len: 0
      char: ""
      delay_str: ""
      span_tag: ""
    nodes:
      start:
        opcode: workflow_start
        next: get_text_length

      # Get the length of the input text
      compute_length:
        opcode: string_length
        isReporter: true
        kwargs:
          text:
            variable: text

      get_text_length:
        opcode: data_set_variable_to
        next: loop_chars
        kwargs:
          variable:
            literal: "text_len"
          value:
            node: compute_length

      # Loop over each character index
      loop_chars:
        opcode: control_for
        next: return_spans
        kwargs:
          var:
            literal: "i"
          start:
            literal: 0
          end:
            variable: text_len
          step:
            literal: 1
          body:
            branch: extract_char

      # -- Loop body: build a <span> for the current character --

      # Extract the character at index i
      char_at_i:
        opcode: string_substring
        isReporter: true
        kwargs:
          text:
            variable: text
          start:
            variable: i
          end:
            node: i_plus_one

      i_plus_one:
        opcode: operator_add
        isReporter: true
        args:
          - variable: i
          - literal: 1

      extract_char:
        opcode: data_set_variable_to
        next: check_space
        kwargs:
          variable:
            literal: "char"
          value:
            node: char_at_i

      # Check if the character is a space (needs special handling)
      is_space:
        opcode: operator_equals
        isReporter: true
        kwargs:
          left:
            variable: char
          right:
            literal: " "

      check_space:
        opcode: control_if_else
        next: compute_delay
        kwargs:
          condition:
            node: is_space
          then:
            branch: set_space_char
          else:
            branch: keep_char

      # Replace space with &nbsp; for HTML
      set_space_char:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "char"
          value:
            literal: "&nbsp;"

      keep_char:
        opcode: noop
        next: null

      # Compute the animation delay: i * 0.08 seconds
      delay_value:
        opcode: operator_multiply
        isReporter: true
        args:
          - variable: i
          - literal: 0.08

      delay_as_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: delay_value

      compute_delay:
        opcode: data_set_variable_to
        next: build_span
        kwargs:
          variable:
            literal: "delay_str"
          value:
            node: delay_as_str

      # Build: <span style="animation-delay:{delay}s">{char}</span>
      # We build this by chaining operator_add reporters
      span_part1:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "<span style=\"animation-delay:"
          right:
            variable: delay_str

      span_part2:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: span_part1
          right:
            literal: "s\">"

      span_part3:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: span_part2
          right:
            variable: char

      span_complete:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: span_part3
          right:
            literal: "</span>"

      build_span:
        opcode: data_set_variable_to
        next: append_span
        kwargs:
          variable:
            literal: "span_tag"
          value:
            node: span_complete

      # Append this span to the accumulated HTML
      accumulated:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: spans_html
          right:
            variable: span_tag

      append_span:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "spans_html"
          value:
            node: accumulated

      # Return the complete spans HTML
      return_spans:
        opcode: workflow_return
        args:
          - variable: spans_html
