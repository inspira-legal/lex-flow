# RAG Question-Answering Pipeline
#
# This workflow implements a complete RAG (Retrieval-Augmented Generation) pipeline:
# 1. Embeds the user's question
# 2. Searches Qdrant for relevant document chunks
# 3. Builds context from search results
# 4. Uses AI to generate an answer grounded in the retrieved context
#
# Run:
#   lexflow examples/showcase/rag_pipeline/ask.yaml \
#     --input question="How does X work?" \
#     --input project=YOUR_GCP_PROJECT
#
# Optional:
#   --input collection=documents    Qdrant collection name (default: documents)
#   --input num_results=3           Number of context chunks (default: 3)
#   --input location=us-central1    GCP region (default: us-central1)
#   --input rerank=false            Disable BM25 reranking (default: true)
#
# Requirements:
#   pip install lexflow[rag,ai]
#   gcloud auth application-default login
#   Qdrant server running at localhost:6333

workflows:
  - name: main
    interface:
      inputs: [question, project, collection, num_results, location, rerank]
      outputs: []
    variables:
      # Input parameters
      question: ""
      project: ""
      collection: "documents"
      num_results: 3
      location: "us-central1"
      rerank: true
      # Qdrant client
      qdrant_client: null
      # Search results
      question_embedding: null
      search_results: null
      results_count: 0
      # Context building
      context_text: ""
      sources_set: null
      current_index: 0
      current_result: null
      current_payload: null
      current_text: ""
      current_source: ""
      # AI components
      model: null
      rag_agent: null
      full_prompt: ""
      answer: ""
    nodes:
      start:
        opcode: workflow_start
        next: print_question_header

      # ========================================================================
      # HEADER - Print the question
      # ========================================================================
      print_question_header:
        opcode: io_print
        next: print_question_value
        args:
          - literal: "\n"

      format_question_display:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "Question: "
          right:
            node: format_question_display_2

      format_question_display_2:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: question
          right:
            literal: "\n\n"

      print_question_value:
        opcode: io_print
        next: print_retrieving
        args:
          - node: format_question_display

      # ========================================================================
      # RETRIEVAL - Connect to Qdrant and search
      # ========================================================================
      print_retrieving:
        opcode: io_print
        next: store_qdrant_client
        args:
          - literal: "Retrieving relevant context...\n"

      # Connect to Qdrant
      connect_qdrant:
        opcode: qdrant_connect
        isReporter: true
        kwargs:
          url:
            literal: "http://localhost:6333"

      store_qdrant_client:
        opcode: data_set_variable_to
        next: store_question_embedding
        kwargs:
          variable:
            literal: "qdrant_client"
          value:
            node: connect_qdrant

      # Create embedding for the question
      create_question_embedding:
        opcode: embedding_create
        isReporter: true
        kwargs:
          text:
            variable: question
          project:
            variable: project
          location:
            variable: location
          model:
            literal: "text-multilingual-embedding-002"

      store_question_embedding:
        opcode: data_set_variable_to
        next: store_search_results
        kwargs:
          variable:
            literal: "question_embedding"
          value:
            node: create_question_embedding

      # Search Qdrant for relevant chunks
      search_qdrant:
        opcode: qdrant_search
        isReporter: true
        kwargs:
          client:
            variable: qdrant_client
          collection:
            variable: collection
          query_vector:
            variable: question_embedding
          limit:
            variable: num_results

      store_search_results:
        opcode: data_set_variable_to
        next: check_rerank
        kwargs:
          variable:
            literal: "search_results"
          value:
            node: search_qdrant

      # Conditionally apply BM25 reranking
      check_rerank:
        opcode: control_if
        next: store_results_count
        kwargs:
          condition:
            variable: rerank
          then:
            branch: rerank_results

      # BM25 rerank search results
      do_rerank:
        opcode: bm25_rerank
        isReporter: true
        kwargs:
          query:
            variable: question
          results:
            variable: search_results
          top_k:
            variable: num_results

      rerank_results:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "search_results"
          value:
            node: do_rerank

      # Get results count
      get_results_count:
        opcode: list_length
        isReporter: true
        kwargs:
          items:
            variable: search_results

      store_results_count:
        opcode: data_set_variable_to
        next: init_sources_set
        kwargs:
          variable:
            literal: "results_count"
          value:
            node: get_results_count

      # Initialize sources set (using a dict to track unique sources)
      create_sources_set:
        opcode: dict_create
        isReporter: true

      init_sources_set:
        opcode: data_set_variable_to
        next: build_context_loop
        kwargs:
          variable:
            literal: "sources_set"
          value:
            node: create_sources_set

      # ========================================================================
      # BUILD CONTEXT - Loop through results and concatenate
      # ========================================================================
      build_context_loop:
        opcode: control_while
        next: print_found_context
        kwargs:
          condition:
            node: check_context_index
          body:
            branch: process_result

      check_context_index:
        opcode: operator_less_than
        isReporter: true
        kwargs:
          left:
            variable: current_index
          right:
            variable: results_count

      # Process each search result
      process_result:
        opcode: data_set_variable_to
        next: extract_payload
        kwargs:
          variable:
            literal: "current_result"
          value:
            node: get_current_result

      get_current_result:
        opcode: list_get
        isReporter: true
        kwargs:
          items:
            variable: search_results
          index:
            variable: current_index

      # Extract payload from result
      extract_payload:
        opcode: data_set_variable_to
        next: extract_text
        kwargs:
          variable:
            literal: "current_payload"
          value:
            node: get_payload

      get_payload:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_result
          key:
            literal: "payload"

      # Extract text from payload
      extract_text:
        opcode: data_set_variable_to
        next: extract_source
        kwargs:
          variable:
            literal: "current_text"
          value:
            node: get_text

      get_text:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_payload
          key:
            literal: "text"
          default:
            literal: ""

      # Extract source from payload
      extract_source:
        opcode: data_set_variable_to
        next: add_source_to_set
        kwargs:
          variable:
            literal: "current_source"
          value:
            node: get_source

      get_source:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_payload
          key:
            literal: "source"
          default:
            literal: "unknown"

      # Add source to sources set (dict key = source name)
      add_source_to_set:
        opcode: dict_set
        next: append_to_context
        kwargs:
          d:
            variable: sources_set
          key:
            variable: current_source
          value:
            literal: true

      # Append text to context with source attribution
      append_to_context:
        opcode: data_set_variable_to
        next: increment_context_index
        kwargs:
          variable:
            literal: "context_text"
          value:
            node: build_context_entry

      build_context_entry:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: context_text
          right:
            node: format_context_entry

      format_context_entry:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "[Source: "
          right:
            node: format_context_entry_2

      format_context_entry_2:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: current_source
          right:
            node: format_context_entry_3

      format_context_entry_3:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "]\n"
          right:
            node: format_context_entry_4

      format_context_entry_4:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: current_text
          right:
            literal: "\n\n"

      # Increment index
      increment_context_index:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "current_index"
          value:
            node: next_context_index

      next_context_index:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: current_index
          right:
            literal: 1

      # ========================================================================
      # PRINT FOUND CONTEXT INFO
      # ========================================================================
      print_found_context:
        opcode: io_print
        next: print_generating
        args:
          - node: format_found_context

      # Get number of unique sources
      get_sources_keys:
        opcode: dict_keys
        isReporter: true
        kwargs:
          d:
            variable: sources_set

      get_sources_count:
        opcode: list_length
        isReporter: true
        kwargs:
          items:
            node: get_sources_keys

      results_count_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: results_count

      sources_count_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: get_sources_count

      format_found_context:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "   Found "
          right:
            node: format_found_context_2

      format_found_context_2:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: results_count_str
          right:
            node: format_found_context_3

      format_found_context_3:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: " relevant passages from "
          right:
            node: format_found_context_4

      format_found_context_4:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: sources_count_str
          right:
            literal: " documents\n\n"

      # ========================================================================
      # AI GENERATION - Create agent and generate answer
      # ========================================================================
      print_generating:
        opcode: io_print
        next: store_model
        args:
          - literal: "Generating answer...\n"

      # Create Vertex AI Model
      create_model:
        opcode: pydantic_ai_create_vertex_model
        isReporter: true
        kwargs:
          model_name:
            literal: "gemini-2.5-flash"
          project:
            variable: project
          location:
            variable: location

      store_model:
        opcode: data_set_variable_to
        next: store_rag_agent
        kwargs:
          variable:
            literal: "model"
          value:
            node: create_model

      # Create RAG Agent with specialized system prompt
      create_rag_agent:
        opcode: pydantic_ai_create_agent
        isReporter: true
        kwargs:
          model:
            variable: model
          instructions:
            literal: |
              You are a helpful assistant that answers questions based on the provided context.
              Only use information from the context to answer. If the context doesn't contain
              enough information to answer, say so honestly.
              Be concise and cite which source document the information came from.

      store_rag_agent:
        opcode: data_set_variable_to
        next: store_full_prompt
        kwargs:
          variable:
            literal: "rag_agent"
          value:
            node: create_rag_agent

      # Build the full prompt with context and question
      build_full_prompt:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "CONTEXT:\n"
          right:
            node: build_full_prompt_2

      build_full_prompt_2:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: context_text
          right:
            node: build_full_prompt_3

      build_full_prompt_3:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "\nQUESTION: "
          right:
            node: build_full_prompt_4

      build_full_prompt_4:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: question
          right:
            literal: "\n\nPlease answer the question based only on the provided context. Cite your sources."

      store_full_prompt:
        opcode: data_set_variable_to
        next: store_answer
        kwargs:
          variable:
            literal: "full_prompt"
          value:
            node: build_full_prompt

      # Run the AI agent
      run_rag_agent:
        opcode: pydantic_ai_run
        isReporter: true
        kwargs:
          agent:
            variable: rag_agent
          prompt:
            variable: full_prompt

      store_answer:
        opcode: data_set_variable_to
        next: print_answer_header
        kwargs:
          variable:
            literal: "answer"
          value:
            node: run_rag_agent

      # ========================================================================
      # OUTPUT - Print the answer nicely formatted
      # ========================================================================
      print_answer_header:
        opcode: io_print
        next: print_answer
        args:
          - literal: "\n--------------------------------------------------------------------------------\nANSWER\n--------------------------------------------------------------------------------\n\n"

      format_answer_output:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: answer
          right:
            literal: "\n"

      print_answer:
        opcode: io_print
        next: print_sources_header
        args:
          - node: format_answer_output

      # Print sources
      print_sources_header:
        opcode: io_print
        next: print_sources_list
        args:
          - literal: "\nSources: "

      # Join source names
      join_sources:
        opcode: string_join
        isReporter: true
        args:
          - node: get_sources_keys
          - literal: ", "

      format_sources_output:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: join_sources
          right:
            literal: "\n"

      print_sources_list:
        opcode: io_print
        next: print_footer
        args:
          - node: format_sources_output

      # Footer
      print_footer:
        opcode: io_print
        next: null
        args:
          - literal: "--------------------------------------------------------------------------------\n\n"
