# GCS PDF Ingestion Workflow - RAG Pipeline
#
# Processes a PDF from Google Cloud Storage: downloads from GCS, extracts text,
# chunks it, generates embeddings, and stores in Qdrant for semantic search.
#
# Run:
#   lexflow examples/showcase/rag_pipeline/ingest_gcs.yaml \
#     --input bucket=my-bucket-name \
#     --input object_name=documents/sample.pdf \
#     --input project=YOUR_GCP_PROJECT
#
# Optional:
#   --input collection=documents      Collection name (default: documents)
#   --input chunk_size=1000           Characters per chunk (default: 1000)
#   --input overlap=200               Overlap between chunks (default: 200)
#   --input location=us-central1      GCP region (default: us-central1)
#   --input qdrant_url=http://localhost:6333  Qdrant URL
#
# Requirements:
#   pip install lexflow[rag,gcs]
#   gcloud auth application-default login
#   docker-compose up -d  (to start Qdrant)

workflows:
  - name: main
    interface:
      inputs: [bucket, object_name, project, collection, chunk_size, overlap, location, qdrant_url]
      outputs: []
    variables:
      # Input parameters
      bucket: ""
      object_name: ""
      project: ""
      collection: "documents"
      chunk_size: 1000
      overlap: 200
      location: "us-central1"
      qdrant_url: "http://localhost:6333"
      # State variables
      gcs_client: null
      pdf_bytes: null
      qdrant_client: null
      pdf_pages: []
      chunks: []
      chunk_texts: []
      chunk_count: 0
      embeddings: []
      ids: []
      payloads: []
      current_index: 0
      current_chunk: null
      source_path: ""
    nodes:
      start:
        opcode: workflow_start
        next: build_source_path

      # Build source path for display (gs://bucket/object)
      source_path_prefix:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "gs://"
          right:
            variable: bucket

      source_path_full:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: source_path_prefix
          right:
            node: source_path_suffix

      source_path_suffix:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "/"
          right:
            variable: object_name

      build_source_path:
        opcode: data_set_variable_to
        next: print_header
        kwargs:
          variable:
            literal: "source_path"
          value:
            node: source_path_full

      # ========================================================================
      # HEADER
      # ========================================================================
      print_header:
        opcode: io_print
        next: print_separator
        args:
          - literal: "\n================================================================================\n"

      print_separator:
        opcode: io_print
        next: print_title
        args:
          - literal: "                   GCS PDF INGESTION PIPELINE\n"

      print_title:
        opcode: io_print
        next: print_settings_header
        args:
          - literal: "================================================================================\n\n"

      # Print settings
      print_settings_header:
        opcode: io_print
        next: print_bucket
        args:
          - literal: "Settings:\n"

      format_bucket:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Bucket:      "
          right:
            node: bucket_with_newline

      bucket_with_newline:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: bucket
          right:
            literal: "\n"

      print_bucket:
        opcode: io_print
        next: print_object_name
        args:
          - node: format_bucket

      format_object_name:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Object:      "
          right:
            node: object_name_with_newline

      object_name_with_newline:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: object_name
          right:
            literal: "\n"

      print_object_name:
        opcode: io_print
        next: print_collection
        args:
          - node: format_object_name

      format_collection:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Collection:  "
          right:
            node: collection_with_newline

      collection_with_newline:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: collection
          right:
            literal: "\n"

      print_collection:
        opcode: io_print
        next: print_chunk_size
        args:
          - node: format_collection

      format_chunk_size:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Chunk Size:  "
          right:
            node: chunk_size_with_newline

      chunk_size_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: chunk_size

      chunk_size_with_newline:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: chunk_size_str
          right:
            literal: " characters\n"

      print_chunk_size:
        opcode: io_print
        next: print_overlap
        args:
          - node: format_chunk_size

      format_overlap:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "  Overlap:     "
          right:
            node: overlap_with_newline

      overlap_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: overlap

      overlap_with_newline:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: overlap_str
          right:
            literal: " characters\n\n"

      print_overlap:
        opcode: io_print
        next: print_step1
        args:
          - node: format_overlap

      # ========================================================================
      # STEP 1: Create GCS Client
      # ========================================================================
      print_step1:
        opcode: io_print
        next: create_gcs_client
        args:
          - literal: "[1/6] Creating GCS client... "

      do_create_gcs_client:
        opcode: gcs_create_client
        isReporter: true

      create_gcs_client:
        opcode: data_set_variable_to
        next: print_step1_done
        kwargs:
          variable:
            literal: "gcs_client"
          value:
            node: do_create_gcs_client

      print_step1_done:
        opcode: io_print
        next: print_step2
        args:
          - literal: "Done\n"

      # ========================================================================
      # STEP 2: Download PDF from GCS
      # ========================================================================
      print_step2:
        opcode: io_print
        next: download_pdf
        args:
          - literal: "[2/6] Downloading PDF from GCS... "

      do_download_pdf:
        opcode: gcs_download_object_as_bytes
        isReporter: true
        kwargs:
          client:
            variable: gcs_client
          bucket_name:
            variable: bucket
          object_name:
            variable: object_name

      download_pdf:
        opcode: data_set_variable_to
        next: print_step2_done
        kwargs:
          variable:
            literal: "pdf_bytes"
          value:
            node: do_download_pdf

      print_step2_done:
        opcode: io_print
        next: print_step3
        args:
          - literal: "Done\n"

      # ========================================================================
      # STEP 3: Connect to Qdrant
      # ========================================================================
      print_step3:
        opcode: io_print
        next: connect_qdrant
        args:
          - literal: "[3/6] Connecting to Qdrant... "

      do_connect_qdrant:
        opcode: qdrant_connect
        isReporter: true
        kwargs:
          url:
            variable: qdrant_url

      connect_qdrant:
        opcode: data_set_variable_to
        next: print_step3_done
        kwargs:
          variable:
            literal: "qdrant_client"
          value:
            node: do_connect_qdrant

      print_step3_done:
        opcode: io_print
        next: print_step4
        args:
          - literal: "Done\n"

      # ========================================================================
      # STEP 4: Create Collection (if not exists)
      # ========================================================================
      print_step4:
        opcode: io_print
        next: create_collection
        args:
          - literal: "[4/6] Creating collection (if needed)... "

      do_create_collection:
        opcode: qdrant_create_collection
        isReporter: true
        kwargs:
          client:
            variable: qdrant_client
          name:
            variable: collection
          vector_size:
            literal: 768

      create_collection:
        opcode: control_if_else
        next: print_step5
        kwargs:
          condition:
            node: do_create_collection
          then:
            branch: print_created
          else:
            branch: print_exists

      print_created:
        opcode: io_print
        next: null
        args:
          - literal: "Created\n"

      print_exists:
        opcode: io_print
        next: null
        args:
          - literal: "Already exists\n"

      # ========================================================================
      # STEP 5: Extract text from PDF bytes (per page)
      # ========================================================================
      print_step5:
        opcode: io_print
        next: extract_pdf
        args:
          - literal: "[5/6] Extracting text from PDF... "

      do_extract_pdf:
        opcode: pdf_extract_pages_from_bytes
        isReporter: true
        kwargs:
          data:
            variable: pdf_bytes

      extract_pdf:
        opcode: data_set_variable_to
        next: print_step5_done
        kwargs:
          variable:
            literal: "pdf_pages"
          value:
            node: do_extract_pdf

      page_count:
        opcode: list_length
        isReporter: true
        kwargs:
          items:
            variable: pdf_pages

      page_count_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: page_count

      step5_done_msg:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: page_count_str
          right:
            literal: " pages extracted\n"

      print_step5_done:
        opcode: io_print
        next: chunk_text
        args:
          - node: step5_done_msg

      # ========================================================================
      # STEP 6: Chunk, embed, and upsert
      # ========================================================================
      do_chunk_pages:
        opcode: text_chunk_pages_smart
        isReporter: true
        kwargs:
          pages:
            variable: pdf_pages
          chunk_size:
            variable: chunk_size
          overlap:
            variable: overlap

      chunk_text:
        opcode: data_set_variable_to
        next: store_chunk_count
        kwargs:
          variable:
            literal: "chunks"
          value:
            node: do_chunk_pages

      get_chunk_count:
        opcode: list_length
        isReporter: true
        kwargs:
          items:
            variable: chunks

      store_chunk_count:
        opcode: data_set_variable_to
        next: extract_chunk_texts
        kwargs:
          variable:
            literal: "chunk_count"
          value:
            node: get_chunk_count

      # Extract text strings from chunk dicts for embedding
      extract_chunk_texts:
        opcode: data_set_variable_to
        next: extract_texts_loop
        kwargs:
          variable:
            literal: "chunk_texts"
          value:
            literal: []

      extract_texts_loop:
        opcode: control_foreach
        next: generate_embeddings
        kwargs:
          var:
            literal: "current_chunk"
          iterable:
            variable: chunks
          body:
            branch: extract_text_body

      extract_text_body:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "chunk_texts"
          value:
            node: append_chunk_text

      get_chunk_text:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_chunk
          key:
            literal: "text"

      append_chunk_text:
        opcode: list_append
        isReporter: true
        kwargs:
          items:
            variable: chunk_texts
          value:
            node: get_chunk_text

      do_generate_embeddings:
        opcode: embedding_create_batch
        isReporter: true
        kwargs:
          texts:
            variable: chunk_texts
          project:
            variable: project
          location:
            variable: location
          model:
            literal: "text-multilingual-embedding-002"

      generate_embeddings:
        opcode: data_set_variable_to
        next: init_build_loop
        kwargs:
          variable:
            literal: "embeddings"
          value:
            node: do_generate_embeddings

      # Generate a base ID from random number
      base_id:
        opcode: math_random
        isReporter: true
        kwargs:
          min_val:
            literal: 100000
          max_val:
            literal: 999999

      init_build_loop:
        opcode: data_set_variable_to
        next: reset_ids
        kwargs:
          variable:
            literal: "current_index"
          value:
            literal: 0

      reset_ids:
        opcode: data_set_variable_to
        next: reset_payloads
        kwargs:
          variable:
            literal: "ids"
          value:
            literal: []

      reset_payloads:
        opcode: data_set_variable_to
        next: print_step6
        kwargs:
          variable:
            literal: "payloads"
          value:
            literal: []

      # Print step 6 message and continue to build loop
      # NOTE: This is a STATEMENT node (not a reporter) - it has next pointer and no isReporter
      print_step6:
        opcode: io_print
        next: build_loop
        args:
          - literal: "[6/6] Chunking, embedding, and upserting... "

      build_loop:
        opcode: control_foreach
        next: do_upsert
        kwargs:
          var:
            literal: "current_chunk"
          iterable:
            variable: chunks
          body:
            branch: build_loop_body

      # Build loop body: append ID and payload for current chunk
      build_loop_body:
        opcode: data_set_variable_to
        next: build_payload
        kwargs:
          variable:
            literal: "ids"
          value:
            node: append_id

      # Generate unique ID: base_id * 1000 + current_index
      current_id:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: base_id_scaled
          right:
            variable: current_index

      base_id_scaled:
        opcode: operator_multiply
        isReporter: true
        kwargs:
          left:
            node: base_id
          right:
            literal: 1000

      append_id:
        opcode: list_append
        isReporter: true
        kwargs:
          items:
            variable: ids
          value:
            node: current_id

      # Build payload dict for current chunk (which is now a dict with metadata)
      build_payload:
        opcode: data_set_variable_to
        next: increment_index
        kwargs:
          variable:
            literal: "payloads"
          value:
            node: append_payload

      # Extract metadata from current_chunk dict
      get_payload_text:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_chunk
          key:
            literal: "text"

      get_page_start:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_chunk
          key:
            literal: "page_start"

      get_page_end:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_chunk
          key:
            literal: "page_end"

      get_line_start:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_chunk
          key:
            literal: "line_start"

      get_line_end:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_chunk
          key:
            literal: "line_end"

      # Create payload dictionary with text, source, chunk_index, and page/line metadata
      payload_base:
        opcode: dict_create
        isReporter: true

      payload_with_text:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_base
          key:
            literal: "text"
          value:
            node: get_payload_text

      payload_with_source:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_with_text
          key:
            literal: "source"
          value:
            variable: source_path

      payload_with_index:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_with_source
          key:
            literal: "chunk_index"
          value:
            variable: current_index

      payload_with_page_start:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_with_index
          key:
            literal: "page_start"
          value:
            node: get_page_start

      payload_with_page_end:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_with_page_start
          key:
            literal: "page_end"
          value:
            node: get_page_end

      payload_with_line_start:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_with_page_end
          key:
            literal: "line_start"
          value:
            node: get_line_start

      payload_with_line_end:
        opcode: dict_set
        isReporter: true
        kwargs:
          d:
            node: payload_with_line_start
          key:
            literal: "line_end"
          value:
            node: get_line_end

      append_payload:
        opcode: list_append
        isReporter: true
        kwargs:
          items:
            variable: payloads
          value:
            node: payload_with_line_end

      # Increment index for next iteration
      increment_index:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: "current_index"
          value:
            node: next_index

      next_index:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: current_index
          right:
            literal: 1

      # ========================================================================
      # Perform batch upsert to Qdrant
      # ========================================================================
      do_qdrant_upsert:
        opcode: qdrant_upsert_batch
        isReporter: true
        kwargs:
          client:
            variable: qdrant_client
          collection:
            variable: collection
          point_ids:
            variable: ids
          vectors:
            variable: embeddings
          payloads:
            variable: payloads

      do_upsert:
        opcode: control_if
        next: print_footer
        kwargs:
          condition:
            node: do_qdrant_upsert
          then:
            branch: print_upsert_done
          else:
            branch: print_upsert_failed

      print_upsert_done:
        opcode: io_print
        next: null
        args:
          - literal: "Done\n"

      print_upsert_failed:
        opcode: io_print
        next: null
        args:
          - literal: "Failed!\n"

      # ========================================================================
      # FOOTER
      # ========================================================================
      print_footer:
        opcode: io_print
        next: print_success
        args:
          - literal: "\n================================================================================\n"

      chunk_count_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: chunk_count

      success_msg_part1:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "SUCCESS: Ingested "
          right:
            node: chunk_count_str

      success_msg_part2:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: success_msg_part1
          right:
            literal: " chunks from '"

      success_msg_part3:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: success_msg_part2
          right:
            variable: source_path

      success_msg_part4:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: success_msg_part3
          right:
            literal: "' into collection '"

      success_msg_part5:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: success_msg_part4
          right:
            variable: collection

      success_msg:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            node: success_msg_part5
          right:
            literal: "'\n"

      print_success:
        opcode: io_print
        next: print_final_separator
        args:
          - node: success_msg

      print_final_separator:
        opcode: io_print
        next: null
        args:
          - literal: "================================================================================\n\n"
