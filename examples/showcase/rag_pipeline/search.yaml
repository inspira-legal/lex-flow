# Semantic search workflow for RAG pipeline
# Searches the Qdrant vector database for documents similar to the query
# Use --input rerank=false to disable BM25 reranking of search results
workflows:
  - name: main
    interface:
      inputs: ["query", "project", "collection", "limit", "location", "rerank"]
      outputs: []
    variables:
      query: ""
      project: ""
      collection: "documents"
      limit: 5
      location: "us-central1"
      rerank: true
      client: null
      query_embedding: null
      results: []
      result_count: 0
      result_index: 0
      current_result: null
    nodes:
      start:
        opcode: workflow_start
        next: print_search_header

      # Print search header with query
      print_search_header:
        opcode: io_print
        next: connect_qdrant
        args:
          - node: search_header_text

      search_header_text:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "\n"
          - node: search_header_with_query

      search_header_with_query:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "Searching for: \""
          - node: query_with_suffix

      query_with_suffix:
        opcode: operator_add
        isReporter: true
        args:
          - variable: query
          - literal: "\"\n"

      # Connect to Qdrant
      connect_qdrant:
        opcode: data_set_variable_to
        next: create_query_embedding
        kwargs:
          variable:
            literal: client
          value:
            node: qdrant_client

      qdrant_client:
        opcode: qdrant_connect
        isReporter: true

      # Create embedding for the query
      create_query_embedding:
        opcode: data_set_variable_to
        next: search_qdrant
        kwargs:
          variable:
            literal: query_embedding
          value:
            node: embed_query

      embed_query:
        opcode: embedding_create
        isReporter: true
        kwargs:
          text:
            variable: query
          project:
            variable: project
          location:
            variable: location
          model:
            literal: "text-multilingual-embedding-002"

      # Search Qdrant
      search_qdrant:
        opcode: data_set_variable_to
        next: check_rerank
        kwargs:
          variable:
            literal: results
          value:
            node: qdrant_search_results

      qdrant_search_results:
        opcode: qdrant_search
        isReporter: true
        kwargs:
          client:
            variable: client
          collection:
            variable: collection
          query_vector:
            variable: query_embedding
          limit:
            variable: limit

      # Conditionally rerank results using BM25
      check_rerank:
        opcode: control_if
        next: get_result_count
        kwargs:
          condition:
            variable: rerank
          then:
            branch: store_reranked_results

      # BM25 rerank search results
      bm25_rerank_results:
        opcode: bm25_rerank
        isReporter: true
        kwargs:
          query:
            variable: query
          results:
            variable: results
          top_k:
            variable: limit

      store_reranked_results:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: results
          value:
            node: bm25_rerank_results

      # Get number of results
      get_result_count:
        opcode: data_set_variable_to
        next: print_results_header
        kwargs:
          variable:
            literal: result_count
          value:
            node: count_results

      count_results:
        opcode: list_length
        isReporter: true
        args:
          - variable: results

      # Print results header
      print_results_header:
        opcode: io_print
        next: print_separator_header
        args:
          - node: results_header_text

      results_header_text:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "\nFound "
          - node: count_with_suffix

      count_with_suffix:
        opcode: operator_add
        isReporter: true
        args:
          - node: count_as_str
          - literal: " results:\n"

      count_as_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: result_count

      print_separator_header:
        opcode: io_print
        next: init_result_index
        args:
          - literal: "\n"

      # Initialize result index for loop
      init_result_index:
        opcode: data_set_variable_to
        next: loop_results
        kwargs:
          variable:
            literal: result_index
          value:
            literal: 0

      # Loop through results
      loop_results:
        opcode: control_foreach
        next: print_footer
        kwargs:
          var:
            literal: "current_result"
          iterable:
            variable: results
          body:
            branch: increment_index

      # Increment result index first
      increment_index:
        opcode: data_set_variable_to
        next: print_result_separator
        kwargs:
          variable:
            literal: result_index
          value:
            node: index_plus_one

      index_plus_one:
        opcode: operator_add
        isReporter: true
        args:
          - variable: result_index
          - literal: 1

      # Print result separator line
      print_result_separator:
        opcode: io_print
        next: print_result_header
        args:
          - literal: "------------------------------------------------------------\n"

      # Print result header: #N | Score: X.XX | Source: filename
      print_result_header:
        opcode: io_print
        next: print_text_label
        args:
          - node: result_header_line

      result_header_line:
        opcode: operator_add
        isReporter: true
        args:
          - node: result_number_part
          - node: score_and_source_part

      result_number_part:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "#"
          - node: index_as_str

      index_as_str:
        opcode: str
        isReporter: true
        kwargs:
          value:
            variable: result_index

      score_and_source_part:
        opcode: operator_add
        isReporter: true
        args:
          - node: score_part
          - node: source_part_with_newline

      score_part:
        opcode: operator_add
        isReporter: true
        args:
          - literal: " | Score: "
          - node: score_formatted

      score_formatted:
        opcode: str
        isReporter: true
        kwargs:
          value:
            node: get_score

      get_score:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_result
          key:
            literal: "score"
          default:
            literal: 0.0

      source_part_with_newline:
        opcode: operator_add
        isReporter: true
        args:
          - node: source_part
          - literal: "\n"

      source_part:
        opcode: operator_add
        isReporter: true
        args:
          - literal: " | Source: "
          - node: get_source

      get_source:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            node: get_payload
          key:
            literal: "source"
          default:
            literal: "unknown"

      get_payload:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_result
          key:
            literal: "payload"
          default:
            literal: {}

      # Print text label
      print_text_label:
        opcode: io_print
        next: print_text_content
        args:
          - literal: "------------------------------------------------------------\n"

      # Print text content (truncated)
      print_text_content:
        opcode: io_print
        next: print_result_end
        args:
          - node: text_content_formatted

      text_content_formatted:
        opcode: operator_add
        isReporter: true
        args:
          - literal: "Text: "
          - node: text_with_newlines

      text_with_newlines:
        opcode: operator_add
        isReporter: true
        args:
          - node: truncated_text
          - literal: "\n"

      truncated_text:
        opcode: string_substring
        isReporter: true
        args:
          - node: get_text
          - literal: 0
          - literal: 200

      get_text:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            node: get_payload_for_text
          key:
            literal: "text"
          default:
            literal: "(no text)"

      get_payload_for_text:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: current_result
          key:
            literal: "payload"
          default:
            literal: {}

      # Print end of result
      print_result_end:
        opcode: io_print
        next: null
        args:
          - literal: "\n"

      # Print footer
      print_footer:
        opcode: io_print
        next: null
        args:
          - literal: "------------------------------------------------------------\n"
