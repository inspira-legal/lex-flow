# Example: Basic Web Search
#
# This workflow demonstrates basic web search functionality using the Tavily API.
#
# Prerequisites:
#   - pip install lexflow[search]
#   - Set TAVILY_API_KEY environment variable
#
# Run:
#   TAVILY_API_KEY=your-key uv run lexflow examples/web_search/basic_search.yaml --input query="Python 3.12 features"

workflows:
  - name: main
    interface:
      inputs: ["query"]
      outputs: []
    variables:
      query: "Python programming best practices"
      results: null
      result: null
      i: 0
    nodes:
      start:
        opcode: workflow_start
        next: print_header

      print_header:
        opcode: io_print
        next: do_search
        args:
          - literal: "\n=== Web Search Demo ===\n\n"

      # === Perform Search ===

      search:
        opcode: web_search
        isReporter: true
        kwargs:
          query:
            variable: query
          max_results:
            literal: 5
          search_depth:
            literal: "basic"

      do_search:
        opcode: data_set_variable_to
        next: print_query
        kwargs:
          variable:
            literal: "results"
          value:
            node: search

      # === Display Results ===

      print_query:
        opcode: io_print
        next: print_query_value
        args:
          - literal: "Query: "

      print_query_value:
        opcode: io_print
        next: print_newline1
        args:
          - variable: query

      print_newline1:
        opcode: io_print
        next: print_results_header
        args:
          - literal: "\n\n"

      print_results_header:
        opcode: io_print
        next: get_results_list
        args:
          - literal: "Results:\n"

      # Get results array from response
      results_list:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: results
          key:
            literal: "results"

      get_results_list:
        opcode: data_set_variable_to
        next: loop_results
        kwargs:
          variable:
            literal: "results"
          value:
            node: results_list

      # === Loop Through Results ===

      loop_results:
        opcode: control_foreach
        next: print_footer
        kwargs:
          var:
            literal: "result"
          iterable:
            variable: results
          body:
            branch: print_result

      # === Print Each Result ===

      print_result:
        opcode: io_print
        next: print_title
        args:
          - literal: "\n---\n"

      get_title:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: result
          key:
            literal: "title"

      print_title:
        opcode: io_print
        next: print_url_label
        args:
          - node: get_title

      print_url_label:
        opcode: io_print
        next: print_url
        args:
          - literal: "\nURL: "

      get_url:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: result
          key:
            literal: "url"

      print_url:
        opcode: io_print
        next: print_content_label
        args:
          - node: get_url

      print_content_label:
        opcode: io_print
        next: print_content
        args:
          - literal: "\nContent: "

      get_content:
        opcode: dict_get
        isReporter: true
        kwargs:
          d:
            variable: result
          key:
            literal: "content"

      print_content:
        opcode: io_print
        next: null
        args:
          - node: get_content

      # === Footer ===

      print_footer:
        opcode: io_print
        next: null
        args:
          - literal: "\n\n=== Search Complete ===\n"
