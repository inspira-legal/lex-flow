# Interactive Web Demo
# Run this with the web frontend to see interactive web opcodes in action
#
# Note: web_send and web_recv channels are automatically injected by the
# WebSocket handler when running in the web frontend.

workflows:
  - name: main
    interface:
      inputs: ["web_send", "web_recv"]
      outputs: []
    variables:
      user_name: ""
      favorite_color: ""
    nodes:
      start:
        opcode: workflow_start
        next: greet

      greet:
        opcode: web_markdown
        next: save_name
        args:
          - variable: web_send
          - literal: "# Welcome to LexFlow!\n\nThis demo shows interactive web opcodes."

      # Reporter: prompts for name input
      ask_name:
        opcode: web_input
        isReporter: true
        args:
          - variable: web_send
          - variable: web_recv
          - literal: "What is your name?"

      save_name:
        opcode: data_set_variable_to
        next: show_greeting
        kwargs:
          variable:
            literal: "user_name"
          value:
            node: ask_name

      # Reporter: builds greeting message
      greeting_msg:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "Hello, "
          right:
            node: add_exclaim

      add_exclaim:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: user_name
          right:
            literal: "!"

      show_greeting:
        opcode: web_alert
        next: save_color
        args:
          - variable: web_send
          - node: greeting_msg
          - literal: "success"

      # Reporter: prompts for color selection
      ask_color:
        opcode: web_select
        isReporter: true
        args:
          - variable: web_send
          - variable: web_recv
          - literal: ["Red", "Green", "Blue", "Purple"]
          - literal: "What's your favorite color?"

      save_color:
        opcode: data_set_variable_to
        next: show_color
        kwargs:
          variable:
            literal: "favorite_color"
          value:
            node: ask_color

      # Reporter: builds color message
      color_msg:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            literal: "You chose: **"
          right:
            node: color_msg_end

      color_msg_end:
        opcode: operator_add
        isReporter: true
        kwargs:
          left:
            variable: favorite_color
          right:
            literal: "**"

      show_color:
        opcode: web_markdown
        next: check_confirm
        args:
          - variable: web_send
          - node: color_msg

      # Reporter: prompts for confirmation
      confirm_done:
        opcode: web_confirm
        isReporter: true
        args:
          - variable: web_send
          - variable: web_recv
          - literal: "Would you like to see a progress demo?"

      check_confirm:
        opcode: control_if
        next: finish
        kwargs:
          condition:
            node: confirm_done
          then:
            branch: progress_demo

      progress_demo:
        opcode: web_progress
        next: progress_50
        args:
          - variable: web_send
          - literal: 25
          - literal: 100
          - literal: "Loading..."

      progress_50:
        opcode: web_progress
        next: progress_75
        args:
          - variable: web_send
          - literal: 50
          - literal: 100
          - literal: "Processing..."

      progress_75:
        opcode: web_progress
        next: progress_100
        args:
          - variable: web_send
          - literal: 75
          - literal: 100
          - literal: "Almost done..."

      progress_100:
        opcode: web_progress
        next: show_table
        args:
          - variable: web_send
          - literal: 100
          - literal: 100
          - literal: "Complete!"

      show_table:
        opcode: web_table
        next: null
        args:
          - variable: web_send
          - literal:
              - name: Alice
                score: 95
              - name: Bob
                score: 87
              - name: Charlie
                score: 92

      finish:
        opcode: web_alert
        next: null
        args:
          - variable: web_send
          - literal: "Demo complete! Thanks for trying LexFlow."
          - literal: "info"
