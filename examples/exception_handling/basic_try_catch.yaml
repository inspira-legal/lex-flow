workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      result: 0
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: try_divide
        args:
          - literal: "=== Testing Basic Try-Catch ===\n\n"

      # Try-catch node for division by zero
      try_divide:
        opcode: control_try
        next: print_done
        kwargs:
          try:
            branch: do_divide
          catch:
            - exception_type: "ZeroDivisionError"
              var: "error"
              body:
                branch: handle_error

      # Try body - will throw ZeroDivisionError
      do_divide:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: result
          value:
            node: divide_calc

      divide_calc:
        opcode: operator_divide
        kwargs:
          left:
            literal: 10
          right:
            literal: 0
        isReporter: true

      # Catch body - print error message
      handle_error:
        opcode: io_print
        next: print_error_var
        args:
          - literal: "✓ Caught exception: "

      print_error_var:
        opcode: io_print
        next: print_newline
        args:
          - variable: error

      print_newline:
        opcode: io_print
        next: null
        args:
          - literal: "\n"

      print_done:
        opcode: io_print
        next: null
        args:
          - literal: "\n✅ Try-catch basic test passed!\n"
