workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables: {}
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: safe_divide
        args:
          - literal: "=== Accessing Exception Variable ===\n\n"

      # The catch block binds the exception message to variable "err"
      safe_divide:
        opcode: control_try
        next: done
        kwargs:
          try:
            branch: attempt_divide
          catch:
            - exception_type: "ZeroDivisionError"
              var: "err" # This creates a variable named "err"
              body:
                branch: handle_error

      attempt_divide:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: result
          value:
            node: calc_divide

      calc_divide:
        opcode: operator_divide
        kwargs:
          left:
            literal: 100
          right:
            literal: 0
        isReporter: true

      # In the catch body, access the variable using {variable: err}
      handle_error:
        opcode: io_print
        next: print_error_message
        args:
          - literal: "Caught exception!\n"

      print_error_message:
        opcode: io_print
        next: print_error_value
        args:
          - literal: "Error message: "

      # Access the exception message via the variable
      print_error_value:
        opcode: io_print
        next: print_newline
        args:
          - variable: err # <-- This is how you access it!

      print_newline:
        opcode: io_print
        next: null
        args:
          - literal: "\n"

      done:
        opcode: io_print
        next: null
        args:
          - literal: "\n✅ Exception variable access example complete!\n"
