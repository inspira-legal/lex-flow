workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      cleanup_executed: false
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: test_try_finally
        args:
          - literal: "=== Testing Try-Finally ===\n\n"

      # Test try-finally without exception
      test_try_finally:
        opcode: control_try
        next: check_cleanup
        kwargs:
          try:
            branch: normal_execution
          finally:
            branch: cleanup

      normal_execution:
        opcode: io_print
        next: null
        args:
          - literal: "✓ Normal execution completed\n"

      cleanup:
        opcode: data_set_variable_to
        next: print_cleanup
        kwargs:
          variable:
            literal: cleanup_executed
          value:
            literal: true

      print_cleanup:
        opcode: io_print
        next: null
        args:
          - literal: "✓ Finally block executed\n"

      check_cleanup:
        opcode: control_if_else
        kwargs:
          condition:
            node: cleanup_check
          then:
            branch: cleanup_success
          else:
            branch: cleanup_failed

      cleanup_check:
        opcode: operator_equals
        kwargs:
          left:
            variable: cleanup_executed
          right:
            literal: true
        isReporter: true

      cleanup_success:
        opcode: io_print
        next: null
        args:
          - literal: "\n✅ Try-finally test passed!\n"

      cleanup_failed:
        opcode: io_print
        next: null
        args:
          - literal: "\n✗ Finally block did not execute!\n"
