workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables:
      result: 0
      status: "unknown"
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: example_1
        args:
          - literal: "=== Exception Handling Examples ===\n\n"

      # Example 1: Safe division with error recovery
      example_1:
        opcode: io_print
        next: safe_divide
        args:
          - literal: "1. Safe Division:\n"

      safe_divide:
        opcode: control_try
        next: example_2
        kwargs:
          try:
            branch: attempt_divide
          finally:
            branch: log_division_attempt

          catch:
            - exception_type: "ZeroDivisionError"
              var: "err"
              body:
                branch: use_default_value
      attempt_divide:
        opcode: data_set_variable_to
        next: null
        kwargs:
          variable:
            literal: result
          value:
            node: calc_divide

      calc_divide:
        opcode: operator_divide
        kwargs:
          left:
            literal: 100
          right:
            literal: 0
        isReporter: true

      use_default_value:
        opcode: data_set_variable_to
        next: print_recovery
        kwargs:
          variable:
            literal: result
          value:
            literal: 0

      print_recovery:
        opcode: io_print
        next: null
        args:
          - literal: "   ✓ Caught division by zero, using default value\n"

      log_division_attempt:
        opcode: io_print
        next: null
        args:
          - literal: "   ℹ Finally: Division attempt completed\n\n"

      # Example 2: Validation with assertions
      example_2:
        opcode: io_print
        next: validate_input
        args:
          - literal: "2. Input Validation:\n"

      validate_input:
        opcode: control_try
        next: example_3
        kwargs:
          try:
            branch: check_assertions
          catch:
            - exception_type: "AssertionError"
              var: "msg"
              body:
                branch: handle_invalid_input

      check_assertions:
        opcode: assert_true
        next: assert_range
        kwargs:
          condition:
            node: is_positive
          message:
            literal: "Value must be positive"

      is_positive:
        opcode: operator_greater_than
        kwargs:
          left:
            literal: -5
          right:
            literal: 0
        isReporter: true

      assert_range:
        opcode: io_print
        next: null
        args:
          - literal: "   ✓ Value in valid range\n"

      handle_invalid_input:
        opcode: io_print
        next: print_assertion_msg
        args:
          - literal: "   ✓ Caught assertion failure: "

      print_assertion_msg:
        opcode: io_print
        next: null
        args:
          - variable: msg

      # Example 3: Multiple exception types
      example_3:
        opcode: io_print
        next: multi_catch
        args:
          - literal: "\n\n3. Multiple Exception Types:\n"

      multi_catch:
        opcode: control_try
        next: example_4
        kwargs:
          try:
            branch: risky_operation
          catch:
            - exception_type: "ValueError"
              var: "e"
              body:
                branch: handle_value_error
            - exception_type: "TypeError"
              var: "e"
              body:
                branch: handle_type_error
            - exception_type: null
              var: "e"
              body:
                branch: handle_unknown

      risky_operation:
        opcode: throw_type_error
        next: null
        kwargs:
          message:
            literal: "Invalid type provided"

      handle_value_error:
        opcode: io_print
        next: null
        args:
          - literal: "   ✓ ValueError handler\n"

      handle_type_error:
        opcode: io_print
        next: null
        args:
          - literal: "   ✓ TypeError handler executed\n"

      handle_unknown:
        opcode: io_print
        next: null
        args:
          - literal: "   ✓ Catch-all handler\n"

      # Example 4: Custom error messages with control_throw
      example_4:
        opcode: io_print
        next: custom_throw
        args:
          - literal: "\n4. Custom Error Messages:\n"

      custom_throw:
        opcode: control_try
        next: done
        kwargs:
          try:
            branch: throw_custom
          catch:
            - exception_type: "RuntimeError"
              var: "custom_msg"
              body:
                branch: show_custom_msg

      throw_custom:
        opcode: control_throw
        next: null
        kwargs:
          value:
            literal: "User authentication failed: invalid credentials"

      show_custom_msg:
        opcode: io_print
        next: print_custom_msg
        args:
          - literal: "   ✓ Caught custom error: "

      print_custom_msg:
        opcode: io_print
        next: null
        args:
          - variable: custom_msg

      done:
        opcode: io_print
        next: null
        args:
          - literal: "\n\n✅ All exception handling examples completed!\n"
