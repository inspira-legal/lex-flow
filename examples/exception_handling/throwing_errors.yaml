workflows:
  - name: main
    interface:
      inputs: []
      outputs: []
    variables: {}
    nodes:
      start:
        opcode: workflow_start
        next: print_intro

      print_intro:
        opcode: io_print
        next: try_node
        args:
          - literal: "Testing throw opcode\n"

      try_node:
        opcode: control_try
        next: print_done
        kwargs:
          try:
            branch: do_throw
          catch:
            - exception_type: "ValueError"
              var: "e"
              body:
                branch: handle_it

      do_throw:
        opcode: throw_value_error
        next: print_should_not_see
        kwargs:
          message:
            literal: "Test error"

      print_should_not_see:
        opcode: io_print
        next: null
        args:
          - literal: "SHOULD NOT SEE THIS\n"

      handle_it:
        opcode: io_print
        next: null
        args:
          - literal: "Caught the error!\n"

      print_done:
        opcode: io_print
        next: null
        args:
          - literal: "Done\n"
