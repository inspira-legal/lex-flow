[pytest]
# Pytest configuration for Lex Flow

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = lexflow-core/src

# Async support  
asyncio_mode = auto

# Output format
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config

# Minimum version
minversion = 6.0

# Test timeout (10 seconds per test)
timeout = 10

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
